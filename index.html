<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌌 Space Math Quiz</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- Background -->
<div id="stars"></div>
<div id="stars2"></div>
<div id="stars3"></div>

<div class="planet"></div>
<div class="planet2"></div>

<!-- Loading Screen -->
<section id="loading">
    <h1>🚀 SPACE QUIZ</h1>
    <div class="loader"></div>
    <p>Loading Universe...</p>
</section>

<!-- Main Menu -->
<section id="menu" class="hidden">

    <h1>🌌 SPACE QUIZ GAME</h1>

    <p>
        Test your knowledge about
        Arithmetic & Geometric
        Sequences and Series!
    </p>

    <button id="playBtn">
        ▶ Start Game
    </button>

</section>

<!-- Category -->
<section id="category" class="hidden">

<h2>Select Category</h2>

<button class="cat" data-cat="Arithmetic Sequence">
Arithmetic Sequence
</button>

<button class="cat" data-cat="Arithmetic Series">
Arithmetic Series
</button>

<button class="cat" data-cat="Geometric Sequence">
Geometric Sequence
</button>

<button class="cat" data-cat="Geometric Series">
Geometric Series
</button>

</section>

<!-- Difficulty -->
<section id="difficulty" class="hidden">

<h2>Select Difficulty</h2>

<button class="diff" data-diff="easy">
Easy
</button>

<button class="diff" data-diff="medium">
Medium
</button>

<button class="diff" data-diff="hard">
Hard
</button>

</section>

<!-- HUD -->
<section id="quiz" class="hidden">

<div class="hud">

<div>
❤️ Lives:
<span id="lives">3</span>
</div>

<div>
⭐ Score:
<span id="score">0</span>
</div>

<div>
⏱
<span id="timer">30</span>
</div>

</div>

<div class="progress">
<div id="progressBar"></div>
</div>

<div id="questionBox">

<h2 id="question">
Question Here
</h2>

<div id="answers">

<button class="answer"></button>
<button class="answer"></button>
<button class="answer"></button>
<button class="answer"></button>

</div>

</div>

</section>

<!-- Result -->

<section id="result" class="hidden">

<h1>Mission Complete!</h1>

<h2>
Final Score:
<span id="finalScore">
0
</span>
</h2>

<button id="restart">
Play Again
</button>

</section>

<!-- Effects -->

<div id="particles"></div>

<audio id="bgMusic" loop>
<source src="assets/bg.mp3">
</audio>

<audio id="correct">
<source src="assets/correct.mp3">
</audio>

<audio id="wrong">
<source src="assets/wrong.mp3">
</audio>

<audio id="click">
<source src="assets/click.mp3">
</audio>

<script src="questions.js"></script>
<script src="script.js"></script>

</body>
</html>
